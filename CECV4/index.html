<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerMudhra Dental & NEET KB Tester</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      background: #f6f7f9;
      color: #1f2937;
    }
    h1 { margin-bottom: 6px; font-size: 1.4rem; }
    .sub { color: #555; font-size: 0.9rem; margin-bottom: 16px; }
    .bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .bar label { font-size: 0.85rem; color: #374151; }
    .bar input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }
    .bar input[type="number"] {
      width: 64px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      background: #fff;
    }
    button {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #0f172a;
    }
    .answer {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.94rem;
    }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border-color: #fecaca;
    }
    .sources {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #475569;
    }
    .sources ul { margin: 6px 0 0; padding-left: 18px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; font-size: 0.88rem; color: #334155; font-weight: bold; }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.8rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>CareerMudhra BDS / MDS / NEET KB Tester</h1>
  <div class="sub">Sends queries to your Flask backend (<code>app_v5.py</code>) using two-stage FTS5 retrieval + Grok.</div>

  <div class="bar">
    <label for="apiUrl">Backend URL:</label>
    <input id="apiUrl" type="text" value="" />

    <label for="topFiles">Top Files:</label>
    <input id="topFiles" type="number" min="1" max="10" value="4" />

    <label for="topPerFile">Chunks/File:</label>
    <input id="topPerFile" type="number" min="1" max="10" value="3" />
  </div>

  <textarea id="queryInput" placeholder="Ask a question about BDS, MDS, dental colleges, fees, seats, eligibility, or NEET UG/MDS..."></textarea>

  <div class="bar" style="margin-top: 10px;">
    <button id="askBtn" type="button">Ask</button>
    <span id="statusText" class="sub" style="margin: 0;"></span>
  </div>

  <div id="resultContainer"></div>

  <script>
    const apiUrlEl = document.getElementById("apiUrl");
    const topFilesEl = document.getElementById("topFiles");
    const topPerFileEl = document.getElementById("topPerFile");
    const queryInputEl = document.getElementById("queryInput");
    const askBtn = document.getElementById("askBtn");
    const statusText = document.getElementById("statusText");
    const resultContainer = document.getElementById("resultContainer");

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function runQuery() {
      const query = queryInputEl.value.trim();
      const baseUrl = apiUrlEl.value.trim().replace(/\/+$/, "") || window.location.origin;

      if (!query) {
        resultContainer.innerHTML = `<div class="card error">Please enter a question first.</div>`;
        return;
      }

      askBtn.disabled = true;
      statusText.textContent = "Searching index & querying Grok...";

      try {
        const res = await fetch(`${baseUrl}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            top_files: Number(topFilesEl.value) || 4,
            top_k_per_file: Number(topPerFileEl.value) || 3,
            max_total_chunks: 10
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        const sourcesHtml = (data.sources || []).length
          ? `<div class="sources"><strong>Stage 1 Selected Sources (${data.chunks_used || 0} chunks used):</strong><ul>${
              data.sources.map(s => `<li>${escapeHtml(s.page_title)} <code>(${escapeHtml(s.filename)})</code></li>`).join("")
            }</ul></div>`
          : "";

        resultContainer.innerHTML = `
          <div class="card">
            <h2>Answer</h2>
            <div class="answer">${escapeHtml(data.answer)}</div>
            ${sourcesHtml}
            <details>
              <summary>Inspect raw retrieval metadata</summary>
              <pre>${escapeHtml(JSON.stringify({ selected_files: data.selected_files }, null, 2))}</pre>
            </details>
          </div>
        `;
        statusText.textContent = "Done.";
      } catch (err) {
        resultContainer.innerHTML = `<div class="card error"><strong>Error:</strong> ${escapeHtml(err.message)}</div>`;
        statusText.textContent = "Failed.";
      } finally {
        askBtn.disabled = false;
      }
    }

    askBtn.addEventListener("click", runQuery);
    queryInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        runQuery();
      }
    });
  </script>
</body>
</html>
